name: DNSControl

on:
    push:
        branches: [main]
        paths:
            - ".github/workflows/dnscontrol.yml"
            - "dnsconfig.js"

    workflow_dispatch:

concurrency:
    group: ${{ github.ref }}-dnscontrol

jobs:
    tests:
        name: Tests
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

            - uses: is-a-dev/dnscontrol-action@main
              with:
                  args: check
